[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adl-exercises"
version = "0.1.0"
description = "Advanced Deep Learning exercises"
requires-python = "==3.9.*"

[tool.hatch.envs.default]
python = "3.9"
installer = "uv"
skip-install = true
dependencies = [
    "torch==2.0.0",
    "torchvision==0.15.1",
    "torchaudio==2.0.1",
    "triton==2.0.0; platform_system == 'Linux'",
    "lightning==2.0.3",
    "pytorch-lightning==2.0.3",
    "lightning-utilities==0.8.0",
    "torchmetrics==0.11.4",
    "einops==0.6.1",
    "datasets==2.12.0",
    "huggingface-hub==0.14.1",
    "tensorboard==2.6.0",
    "tensorboard-plugin-wit==1.8.1",
    "protobuf==3.20.3",
    "numpy==1.24.3",
    "scipy==1.8.1",
    "pandas==1.5.3",
    "pyarrow==11.0.0",
    "numexpr==2.8.4",
    "bottleneck==1.3.5",
    "scikit-learn==1.0.2",
    "sympy==1.11.1",
    "networkx==2.8.4",
    "pillow==9.4.0",
    "opencv-contrib-python==4.7.0.72",
    "matplotlib==3.7.1",
    "seaborn==0.12.2",
    "pyyaml==6.0",
    "tqdm==4.65.0",
    "rich==13.4.2",
    "psutil==5.9.1",
    "requests==2.29.0",
]